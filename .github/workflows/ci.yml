name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_SECRET: ci-secret-for-build-only
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_NAME: DocuTrack
  NEXT_PUBLIC_LOGO_URL: /images/logo.png
  RESEND_API_KEY: re_ci_placeholder
  EMAIL_FROM_DOMAIN: example.com
  JWT_VERSION: "1"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key
  TURNSTILE_SECRET_KEY: ci-turnstile-secret-key

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage=false

      - name: Build
        run: npm run build
